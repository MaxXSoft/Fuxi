name: Test

permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip-ci')"

    steps:
    - name: Checkout Fuxi
      uses: actions/checkout@v6

    - name: Setup JDK
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17
        cache: sbt

    - name: Setup sbt
      uses: sbt/setup-sbt@v1

    # Ubuntu 24.04 ships Verilator 5.020, which mis-simulates the Core
    # CSR-write/xRET sequence exercised by the mecall trace.
    - name: Setup Verilator
      uses: veryl-lang/setup-verilator@b155747595eb4b817473a83045ba1da581c4084b
      with:
        version: 5.048

    - name: Check Verilator version
      run: verilator --version

    - name: Generate Verilog
      run: make

    - name: Lint generated Verilog
      run: |
        verilator --lint-only -Wno-fatal --language 1364-2005 \
          --top-module FuxiWrapper \
          verilog/build/Fuxi.v verilog/FuxiWrapper.v

    - name: Test Utilities
      run: |
        sbt "Test / runMain utils.InstEncodingTest"
        sbt "Test / runMain utils.CoreTestSupportTest"
        sbt "Test / runMain utils.AxiTestSupportTest"
        sbt "Test / runMain utils.CoreWritebackLoopTest"

    - name: Test BPU
      run: sbt "Test / runMain bpu.BranchPredictorTest" "Test / runMain bpu.DecoderTrainingTest"

    - name: Test CSR
      run: >-
        sbt "Test / runMain csr.CsrFileTest"
        "Test / runMain csr.CsrInterruptTest"
        "Test / runMain csr.CsrPendingTest"
        "Test / runMain csr.CsrDelegationTest"
        "Test / runMain csr.CsrCounterAccessTest"

    - name: Test LSU
      run: |
        sbt "Test / runMain lsu.AmoExecuteTest"
        sbt "Test / runMain lsu.ExclusiveMonitorTest"
        sbt "Test / runMain lsu.AtomicMemoryTest"
        sbt "Test / runMain lsu.AtomicFaultTest"
        sbt "Test / runMain lsu.AtomicPermissionTest"

    - name: Test MDU
      run: |
        sbt "Test / runMain mdu.DividerTest"
        sbt "Test / runMain mdu.MultiplierTest"
        sbt "Test / runMain mdu.MduTest"

    - name: Test Sim
      run: sbt "Test / runMain sim.RamTest" "Test / runMain sim.RomTest"

    - name: Test Core Stages
      run: |
        sbt "Test / runMain core.stages.FetchTest"
        sbt "Test / runMain core.stages.CompressedDecoderTest"
        sbt "Test / runMain core.stages.DecoderTest"
        sbt "Test / runMain core.stages.AluTest"
        sbt "Test / runMain core.stages.MemTest"
        sbt "Test / runMain core.stages.WriteBackTest"

    - name: Test Bus
      run: |
        sbt "Test / runMain bus.TlbTest"
        sbt "Test / runMain bus.MmuTest"
        sbt "Test / runMain bus.UncachedTest"
        sbt "Test / runMain bus.CoreBusTest"
        sbt "Test / runMain bus.InstCacheTest"

    - name: Test peripheral AXI handshakes
      run: soc/tests/run.sh

    - name: Test Core Integration
      run: |
        sbt "Test / runMain core.integration.ScSequenceTest"
        sbt "Test / runMain core.integration.CoreCsrAliasTest"
        sbt "Test / runMain core.integration.CoreRetirementTest"
        sbt "Test / runMain core.integration.CoreInstretReadTest"
        sbt "Test / runMain core.integration.CoreCompressedTest"
        sbt "Test / runMain core.integration.CoreFetchFaultTest"
        sbt "Test / runMain core.integration.CoreTest -if src/test/resources/fib.txt -tf src/test/resources/fib_trace.txt"
        sbt "Test / runMain core.integration.CoreTest -if src/test/resources/mdu.txt -tf src/test/resources/mdu_trace.txt"
        sbt "Test / runMain core.integration.CoreTest -if src/test/resources/mecall.txt -tf src/test/resources/mecall_trace.txt"
        sbt "Test / runMain core.integration.CoreTest -if src/test/resources/secall.txt -tf src/test/resources/secall_trace.txt"
